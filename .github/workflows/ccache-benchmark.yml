name: ccache Benchmark (Avrea)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache bc bison flex libssl-dev libelf-dev

      - name: Configure ccache
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache --max-size=5G
          ccache --zero-stats

      - name: Build drivers subsystem
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          echo "Available cores: $(nproc)"
          make defconfig
          time make -j$(nproc) drivers/

      - name: Show ccache stats
        run: ccache --show-stats
