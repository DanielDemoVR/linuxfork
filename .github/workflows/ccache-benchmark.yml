name: ccache Benchmark

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache bc bison flex libssl-dev libelf-dev

      - name: Configure ccache
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache --max-size=5G

      - name: Build
        run: |
          make defconfig
          time make -j$(nproc)
