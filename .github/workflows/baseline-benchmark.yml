name: Baseline Benchmark (No Cache)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev

      - name: Build drivers subsystem
        run: |
          make defconfig
          time make -j$(nproc) drivers/
